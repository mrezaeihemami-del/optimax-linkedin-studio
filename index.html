    <meta charset="UTF-8" />

    <meta name="description" content="Automated LinkedIn thought-leadership publisher for HEOR and HTA intelligence with human-in-the-loop review, live mobile preview, and custom canvas graphic generator." />
    <meta property="og:title" content="Optimax LinkedIn Automation Studio" />
    <meta property="og:description" content="Automated LinkedIn thought-leadership publisher for HEOR and HTA intelligence with human-in-the-loop review, live mobile preview, and custom canvas graphic generator." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..800;1,9..40,300..800&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet" />
    <script>
      // Gracefully ignore disabled HMR WebSocket connection errors in sandbox
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && (
          String(event.reason).includes('WebSocket') ||
          String(event.reason?.message).includes('WebSocket') ||
          String(event.reason?.stack).includes('@vite/client')
        )) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        if (event.message && (
          event.message.includes('WebSocket') ||
          event.message.includes('@vite/client')
        )) {
          event.preventDefault();
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
